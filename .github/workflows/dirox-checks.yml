# Dirox checks: the specs (OpenSpec) and the project knowledge (OKF) must be valid, and no PR
# skips closing its change (OKF retro answered, finished change archived, test cases proven) or a
# review gate (design for a big change, QC and a code review for any code).
# Added by /dirox-techlead:setup-project. The OpenSpec version is pinned by the kit.
name: Dirox checks

on:
  pull_request:
    # edited: pr-checks reads the PR description, so it runs again when that changes.
    # ready_for_review: on a draft, pr-checks only warns; marking it ready makes them errors.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # An approval (or its dismissal) runs pr-checks again: the review gates live there.
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  specs-and-knowledge:
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OpenSpec specs and changes
        run: npx -y @fission-ai/openspec@1.14.1 validate --all --strict --no-interactive
      - name: OKF knowledge
        run: node .github/scripts/okf-validate.mjs okf

  pr-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the dropped-spec-lines check reads when each line was added.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OKF retro answered, finished changes archived and proven, review gates passed
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-check.mjs
